# MasriCX data-source registry.
#
# Authoritative, machine-readable record of the datasets used in Phase 1+.
# All facts below were verified by the orchestrator against the live Hugging
# Face dataset cards on 2026-09-20 ("retrieved" date). No invented facts:
# anything not verified is absent or explicitly marked.
#
# Governance summary:
#  * asr_codeswitched_dataset: aggregate card says MIT, but ~12,480 clips come
#    from MohamedRashad/arabic-english-code-switching (revision/source tagged
#    GPL; built partly from YouTube and a now-unavailable predecessor). The
#    aggregate is NOT uniformly MIT. Audit + provisional internal
#    research/training allowed; no redistribution of raw/transformed data;
#    final public weight licensing requires an explicit decision.
#  * EGYSpeak: card says CC-BY-4.0 but upstream Kaggle
#    fadisarwat/egyptian-arabic-lines v5 is GPL-3.0. Pseudo-labelled only;
#    E3 disabled until the conflict is resolved; never treat as gold; no full
#    audio download in Phase 1.
#  * Casablanca Egypt: CC-BY-NC-ND-4.0, evaluation only; never train/augment/
#    tune on it; no redistribution of audio or derivatives; publish aggregate
#    metrics and brief non-sensitive examples with attribution only.

retrieved: "2026-09-20"


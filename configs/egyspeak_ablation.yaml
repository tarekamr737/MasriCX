# E3 — EGYSpeak pseudo-labelled ablation.
#
# EGYSpeak transcripts are machine-generated by another ASR model
# (pseudo-labelled). They are NEVER treated as gold ground truth and never
# dominate the primary training set. Conditions: 0% / 10% / 25% filtered
# EGYSpeak, on top of the best E2 configuration.

experiment:
  name: egyspeak-e3
  experiment: E3
  description: >-
    E2 best configuration with controlled pseudo-labelled EGYSpeak addition:
    0% (control), 10% filtered, 25% filtered. Answers whether pseudo-labelled
    Egyptian-only speech improves dialect robustness or damages code-switched
    ASR quality. Not promoted automatically; promotion requires metrics.

model:
  id: openai/whisper-large-v3-turbo
  revision: 41f01f3fe87f28c78e2fbf8b568835947dd65ed9
  load_in_8bit: true
  dtype: float16

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - v_proj

training:
  learning_rate: 1.0e-4
  epochs: 2
  warmup_ratio: 0.05
  weight_decay: 0.01
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  fp16: true
  eval_strategy: steps
  eval_steps: 250
  save_strategy: steps
  save_steps: 250
  save_total_limit: 3
  seed: 42

dataset:
  id: Seif-Eldeen-Sameh/asr_codeswitched_dataset
  revision: 712de01079517771f95bcdecee68ca232b979628  # pinned (verified 2026-09-20)
  license: "Mixed: aggregate card says MIT, but ~12,480 clips derive from a GPL-tagged source; not uniformly MIT. No redistribution; final model publication blocked pending source review."
  splits:
    train: 90
    validation: 5
    test: 5
    seed: 42

egyspeak:
  id: MohamedGomaa30/EGYSpeak
  is_pseudo_labelled: true   # machine-generated; must remain true
  revision: 59c40fc6833382a743c180f50addcda5edaa47c3  # pinned (verified 2026-09-20)
  license: "Conflicted: card CC-BY-4.0 vs upstream Kaggle GPL-3.0; release blocked pending resolution. Pseudo-labelled only; treat never as gold."
  include_percent: 0         # baseline condition; ablation runs override this
  conditions: [0, 10, 25]
  max_fraction_of_primary: 0.25   # never let EGYSpeak dominate primary data

augmentation:
  enabled: true              # inherits E2 augmentation if E2 wins selection
  seed: 42
  telephone_bandpass_probability: 0.30
  narrowband_resample_probability: 0.30
  mulaw_alaw_probability: 0.15
  gain_variation_probability: 0.20
  clipping_probability: 0.10
  noise_probability: 0.15
  speed_perturbation_probability: 0.10
  speed_rate_range: [0.95, 1.05]
  apply_probability: 0.35
  preserve_transcript: true

telephone_test:
  enabled: true
  seed: 42
  bandpass_hz: [300, 3400]
  reference_resample_khz: 8

# E1 — Core MasriCX: LoRA fine-tuning on the primary code-switched dataset.
# No telephony augmentation. Measures pure fine-tuning gain over E0 baselines.

experiment:
  name: codeswitch-e1
  experiment: E1
  description: >-
    Whisper Large V3 Turbo + LoRA on the primary ~34.1h Egyptian-dominant
    Arabic-English code-switched dataset. No telephone augmentation.

model:
  id: openai/whisper-large-v3-turbo
  load_in_8bit: true
  dtype: float16

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - v_proj

training:
  learning_rate: 1.0e-4
  epochs: 2
  warmup_ratio: 0.05
  weight_decay: 0.01
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  fp16: true
  eval_strategy: steps
  eval_steps: 250
  save_strategy: steps
  save_steps: 250
  save_total_limit: 3
  seed: 42

dataset:
  id: Seif-Eldeen-Sameh/asr_codeswitched_dataset
  revision: TBD    # pinned by orchestrator after data audit (Phase 1)
  license: TBD     # recorded by orchestrator after data audit
  splits:
    train: 90
    validation: 5
    test: 5
    seed: 42

augmentation:
  enabled: false        # E1 is clean-data only (telephone augmentation is E2)
  seed: 42
  telephone_bandpass_probability: 0.0
  narrowband_resample_probability: 0.0
  mulaw_alaw_probability: 0.0
  gain_variation_probability: 0.0
  clipping_probability: 0.0
  noise_probability: 0.0
  speed_perturbation_probability: 0.0
  speed_rate_range: [0.95, 1.05]
  apply_probability: 0.0
  preserve_transcript: true

telephone_test:
  enabled: true         # telephone robustness evaluated despite clean training
  seed: 42
  bandpass_hz: [300, 3400]
  reference_resample_khz: 8

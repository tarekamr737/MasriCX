[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "masricx"
version = "0.1.0"
description = "Egyptian Arabic-English code-switched ASR: LoRA fine-tuning of Whisper Large V3 Turbo."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "MasriCX authors" }]
keywords = ["asr", "whisper", "code-switching", "egyptian-arabic", "lora", "peft"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "PyYAML>=6",
  "pydantic>=2,<3",
]

[project.urls]
Homepage = "https://github.com/tarekamr737/MasriCX"
Repository = "https://github.com/tarekamr737/MasriCX"
Issues = "https://github.com/tarekamr737/MasriCX/issues"

[project.optional-dependencies]
dev = [
  "ruff>=0.8,<1.0",
  "mypy>=1.10",
  "pytest>=8.0",
  "pre-commit>=3.0",
  "types-PyYAML",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
masricx = ["py.typed"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
  "E501",  # long lines handled by formatter where possible
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["yaml.*", "yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error"]
pythonpath = ["src"]
cache_dir = ".runtime/pytest"
